[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "joogopay"
version = "0.1.3"
description = "Merchant open API SDK (Ed25519 / RFC 9421 signing, X25519 sealed box body encryption)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "JooGoPay", email = "support@joogopay.com" }]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]
dependencies = ["pynacl>=1.5"]

[project.urls]
Homepage = "https://github.com/joogopay/sdk-python"
Repository = "https://github.com/joogopay/sdk-python"
Issues = "https://github.com/joogopay/sdk-python/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["joogopay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
